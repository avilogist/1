<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comet - Plugins</title>
    <link rel="icon" type="image/png" href="ss/icon.png">
    
    <meta property="og:title" content="Comet - Plugins">
    <meta property="og:description" content="Create custom plugins for Comet Universal">
    <meta property="og:image" content="https://getcomet.pages.dev/ss/standard.gif">
    <meta property="og:url" content="https://getcomet.pages.dev/plugins">
    <meta property="og:type" content="website">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Comet - Plugins">
    <meta name="twitter:description" content="Create custom plugins for Comet Universal">
    <meta name="twitter:image" content="https://getcomet.pages.dev/ss/standard.gif">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #f5f5dc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
            cursor: none;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(245, 245, 220, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245, 245, 220, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .custom-cursor {
            width: 20px;
            height: 20px;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            background: url('ss/cursor.png') center/contain no-repeat;
            transition: transform 0.15s ease-out;
        }

        .cursor-follower {
            width: 40px;
            height: 40px;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            border: 2px solid rgba(245, 245, 220, 0.3);
            border-radius: 50%;
            transition: all 0.2s ease-out;
        }

        .nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(245, 245, 220, 0.1);
            z-index: 1000;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 3rem;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 600;
            transition: transform 0.3s;
            text-decoration: none;
            color: #f5f5dc;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo img {
            height: 32px;
            width: 32px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .dropdown {
            position: relative;
        }

        .dropdown > a {
            color: #f5f5dc;
            text-decoration: none;
            padding: 0.5rem 1rem;
            display: block;
            transition: all 0.3s;
            position: relative;
        }

        .dropdown > a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: #f5f5dc;
            transition: all 0.3s;
            transform: translateX(-50%);
        }

        .dropdown:hover > a::after {
            width: 80%;
        }

        .dropdown:hover > a {
            color: #fff;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(245, 245, 220, 0.2);
            border-radius: 12px;
            min-width: 200px;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: fadeIn 0.3s ease-out;
        }

        .dropdown-content::before {
            content: '';
            position: absolute;
            top: -0.5rem;
            left: 0;
            right: 0;
            height: 0.5rem;
            background: transparent;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dropdown-content.open {
            display: block;
        }

        .dropdown-content a {
            color: #f5f5dc;
            text-decoration: none;
            padding: 0.75rem 1.25rem;
            display: block;
            transition: all 0.3s;
        }

        .dropdown-content a:hover {
            background: rgba(245, 245, 220, 0.15);
            padding-left: 1.5rem;
        }

        .main-content {
            margin-top: 80px;
            padding: 4rem 2rem;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .header h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #f5f5dc, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .builder-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .builder-section {
            background: rgba(245, 245, 220, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(245, 245, 220, 0.1);
            border-radius: 12px;
            padding: 2rem;
        }

        .builder-section h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #f5f5dc;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            background: rgba(245, 245, 220, 0.05);
            border: 1px solid rgba(245, 245, 220, 0.2);
            border-radius: 8px;
            color: #f5f5dc;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="number"]:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: rgba(245, 245, 220, 0.5);
            background: rgba(245, 245, 220, 0.08);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-row-three {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            background: rgba(245, 245, 220, 0.9);
            color: #0a0a0a;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn:hover {
            background: #f5f5dc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 245, 220, 0.3);
        }

        .btn-secondary {
            background: rgba(245, 245, 220, 0.1);
            color: #f5f5dc;
            border: 1px solid rgba(245, 245, 220, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(245, 245, 220, 0.2);
        }

        .btn-danger {
            background: rgba(220, 50, 50, 0.8);
            color: #fff;
        }

        .btn-danger:hover {
            background: rgba(220, 50, 50, 1);
        }

        .sections-list {
            margin-top: 1.5rem;
        }

        .section-item {
            background: rgba(245, 245, 220, 0.05);
            border: 1px solid rgba(245, 245, 220, 0.2);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .section-item:hover {
            background: rgba(245, 245, 220, 0.08);
            border-color: rgba(245, 245, 220, 0.4);
        }

        .section-item.active {
            border-color: #f5f5dc;
            background: rgba(245, 245, 220, 0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h3 {
            font-size: 1.1rem;
        }

        .content-list {
            margin-top: 1rem;
        }

        .content-item {
            background: rgba(245, 245, 220, 0.03);
            border: 1px solid rgba(245, 245, 220, 0.15);
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-type {
            display: inline-block;
            background: rgba(245, 245, 220, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-right: 0.5rem;
        }

        .btn-small {
            padding: 0.35rem 0.75rem;
            font-size: 0.85rem;
        }

        .output-section {
            background: rgba(245, 245, 220, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(245, 245, 220, 0.1);
            border-radius: 12px;
            padding: 2rem;
        }

        .output-section h2 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #f5f5dc;
        }

        .json-output {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(245, 245, 220, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #f5f5dc;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        select {
            width: 100%;
            padding: 0.75rem;
            background: rgba(245, 245, 220, 0.05);
            border: 1px solid rgba(245, 245, 220, 0.2);
            border-radius: 8px;
            color: #f5f5dc;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:focus {
            outline: none;
            border-color: rgba(245, 245, 220, 0.5);
            background: rgba(245, 245, 220, 0.08);
        }

        select option {
            background: #1a1a1a;
            color: #f5f5dc;
        }

        .color-input-wrapper {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .color-input-wrapper input[type="color"] {
            width: 60px;
            height: 40px;
            border: 1px solid rgba(245, 245, 220, 0.2);
            border-radius: 8px;
            background: rgba(245, 245, 220, 0.05);
            cursor: pointer;
        }

        footer {
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            padding: 3rem 2rem;
            text-align: center;
            border-top: 1px solid rgba(245, 245, 220, 0.1);
            margin-top: 4rem;
        }

        footer p {
            opacity: 0.6;
        }

        @media (max-width: 1024px) {
            .builder-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .form-row,
            .form-row-three {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="custom-cursor"></div>
    <div class="cursor-follower"></div>

    <nav class="nav">
        <a href="index.html" class="logo">
            <img src="ss/icon.png" alt="Comet">
            <span>Comet</span>
        </a>
        <ul class="nav-links">
            <li class="dropdown">
                <a href="#">Resources</a>
                <div class="dropdown-content">
                    <a href="https://github.com/avilogist" target="_blank">GitHub</a>
                    <a href="https://rscripts.net/@acegef" target="_blank">RScripts</a>
                </div>
            </li>
            <li class="dropdown">
                <a href="#">Community</a>
                <div class="dropdown-content">
                    <a href="https://discord.gg/M4HVPGBEvT" target="_blank">Discord</a>
                </div>
            </li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="header">
            <h1>Plugin Creator</h1>
            <p>Create custom plugins for Comet Universal</p>
        </div>

        <div class="builder-container">
            <div class="builder-section">
                <h2>Plugin Setup</h2>
                
                <div class="form-group">
                    <label>Plugin Title (max 8 chars, latin chars)</label>
                    <input type="text" id="pluginTitle" maxlength="8" placeholder="MyPlugin">
                </div>

                <div class="form-group">
                    <label>Plugin Information</label>
                    <textarea id="pluginInfo" placeholder="What's it about?" style="min-height: 100px;"></textarea>
                </div>

                <div class="form-group">
                    <label>Creator Name</label>
                    <input type="text" id="creatorName" placeholder="Your name">
                </div>

                <div class="form-group">
                    <label>Verification Code (optional)</label>
                    <input type="text" id="verificationCode" placeholder="Enter verification code">
                    <button class="btn btn-secondary" style="margin-top: 0.5rem;" onclick="verifyCode()">Verify</button>
                    <div id="verifyStatus" style="margin-top: 0.5rem; font-size: 0.9rem;"></div>
                </div>

                <button class="btn" onclick="addSection()">Add Section</button>
                <button class="btn" style="margin-top: 1rem; background: rgba(100, 220, 100, 0.8);" onclick="publishPlugin()">Publish Plugin</button>
                <div id="publishStatus" style="margin-top: 1rem; font-size: 0.9rem; text-align: center;"></div>

                <div class="sections-list" id="sectionsList"></div>
            </div>

            <div class="builder-section">
                <h2>Section Editor</h2>
                <div id="sectionEditor">
                    <p style="opacity: 0.6; text-align: center;">Select or create a section</p>
                </div>
            </div>
        </div>

        <div class="output-section">
            <h2>Generated JSON</h2>
            <div class="json-output" id="jsonOutput">{"title": "", "sections": []}</div>
            <button class="btn" onclick="copyJSON()">Copy JSON</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Comet. All rights reserved.</p>
    </footer>

    <script>
        const cursor = document.querySelector('.custom-cursor');
        const follower = document.querySelector('.cursor-follower');
        
        let mouseX = 0, mouseY = 0;
        let followerX = 0, followerY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.left = mouseX - 10 + 'px';
            cursor.style.top = mouseY - 10 + 'px';
        });

        function animateFollower() {
            followerX += (mouseX - followerX) * 0.3;
            followerY += (mouseY - followerY) * 0.3;
            follower.style.left = followerX - 20 + 'px';
            follower.style.top = followerY - 20 + 'px';
            requestAnimationFrame(animateFollower);
        }
        animateFollower();

        const dropdowns = document.querySelectorAll('.dropdown');

        function closeAllDropdowns(exception = null) {
            dropdowns.forEach(dropdown => {
                if (dropdown !== exception) {
                    dropdown.querySelector('.dropdown-content').classList.remove('open');
                }
            });
        }

        dropdowns.forEach(dropdown => {
            let content = dropdown.querySelector('.dropdown-content');
            let timer;

            dropdown.addEventListener('mouseenter', () => {
                closeAllDropdowns(dropdown);
                content.classList.add('open');
            });

            dropdown.addEventListener('mouseleave', () => {
                timer = setTimeout(() => {
                    content.classList.remove('open');
                }, 2000);
            });

            content.addEventListener('mouseenter', () => {
                if (timer) clearTimeout(timer);
            });

            content.addEventListener('mouseleave', () => {
                timer = setTimeout(() => {
                    content.classList.remove('open');
                }, 2000);
            });
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown')) {
                closeAllDropdowns();
            }
        });

        let plugin = {
            title: '',
            info: '',
            creator: '',
            sections: []
        };
        let currentSection = null;
        let verifiedUser = null;
        let lastPublishTime = 0;

        function sanitizeText(text, allowBasic = false) {
            if (allowBasic) {
                return text.replace(/[^\x20-\x7E\.\$\(\)\[\]\{\}\,\-\_\!\?]/g, '');
            }
            return text.replace(/[^a-zA-Z0-9]/g, '');
        }

        function updateJSON() {
            const titleInput = document.getElementById('pluginTitle');
            titleInput.value = sanitizeText(titleInput.value);
            plugin.title = titleInput.value;
            
            const infoInput = document.getElementById('pluginInfo');
            infoInput.value = sanitizeText(infoInput.value, true);
            plugin.info = infoInput.value;
            
            const creatorInput = document.getElementById('creatorName');
            creatorInput.value = sanitizeText(creatorInput.value, true);
            plugin.creator = verifiedUser || creatorInput.value;
            
            document.getElementById('jsonOutput').textContent = JSON.stringify(plugin, null, 2);
        }

        async function verifyCode() {
            const code = document.getElementById('verificationCode').value.trim();
            const status = document.getElementById('verifyStatus');
            
            if (!code) {
                status.style.color = '#ff6b6b';
                status.textContent = 'Please enter a verification code';
                return;
            }

            status.style.color = '#ffd93d';
            status.textContent = 'Verifying...';

            try {
                const response = await fetch('https://cometp.v-v.workers.dev/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });

                const data = await response.json();

                if (data.success && data.username) {
                    verifiedUser = data.username + '';
                    status.style.color = '#6bff6b';
                    status.textContent = `Verified as ${data.username}+`;
                    updateJSON();
                } else {
                    status.style.color = '#ff6b6b';
                    status.textContent = (data.error || 'Invalid verification code');
                    verifiedUser = null;
                }
            } catch (error) {
                status.style.color = '#ff6b6b';
                status.textContent = 'Verification failed: ' + error.message;
                verifiedUser = null;
            }
        }

        async function publishPlugin() {
            const status = document.getElementById('publishStatus');
            
            if (!plugin.title) {
                status.style.color = '#ff6b6b';
                status.textContent = 'Please enter a plugin title';
                return;
            }

            if (!plugin.info) {
                status.style.color = '#ff6b6b';
                status.textContent = 'Please enter plugin information';
                return;
            }

            if (!plugin.creator && !verifiedUser) {
                status.style.color = '#ff6b6b';
                status.textContent = 'Please enter a creator name';
                return;
            }

            if (plugin.sections.length === 0) {
                status.style.color = '#ff6b6b';
                status.textContent = 'Please add at least one section';
                return;
            }

            const now = Date.now();
            if (now - lastPublishTime < 60000) {
                const waitTime = Math.ceil((60000 - (now - lastPublishTime)) / 1000);
                status.style.color = '#ff6b6b';
                status.textContent = `Please wait ${waitTime} seconds before publishing again`;
                return;
            }

            status.style.color = '#ffd93d';
            status.textContent = 'Publishing...';

            try {
                const publishData = { ...plugin };
                
                if (verifiedUser) {
                    const verificationCode = document.getElementById('verificationCode').value.trim();
                    publishData.verificationCode = verificationCode;
                }

                const response = await fetch('https://cometp.v-v.workers.dev/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(publishData)
                });

                const data = await response.json();

                if (data.success) {
                    lastPublishTime = now;
                    status.style.color = '#6bff6b';
                    status.textContent = `Published! Plugin Code: ${data.code}`;
                } else {
                    status.style.color = '#ff6b6b';
                    status.textContent = `${data.error || 'Publishing failed'}`;
                }
            } catch (error) {
                status.style.color = '#ff6b6b';
                status.textContent = 'Network error';
            }
        }

        function addSection() {
            const title = prompt('Section Title:');
            if (!title) return;

            const section = {
                title: title,
                content: []
            };

            plugin.sections.push(section);
            renderSections();
            updateJSON();
        }

        function renderSections() {
            const list = document.getElementById('sectionsList');
            list.innerHTML = '';

            plugin.sections.forEach((section, index) => {
                const item = document.createElement('div');
                item.className = 'section-item';
                if (currentSection === index) item.classList.add('active');

                item.innerHTML = `
                    <div class="section-header">
                        <h3>${section.title}</h3>
                        <button class="btn btn-danger btn-small" onclick="deleteSection(${index})">Delete</button>
                    </div>
                    <div class="content-list">
                        ${section.content.map((c, ci) => `
                            <div class="content-item">
                                <span><span class="content-type">${c.type}</span>${c.name || c.title || 'Content'}</span>
                                <button class="btn btn-danger btn-small" onclick="deleteContent(${index}, ${ci})">Delete</button>
                            </div>
                        `).join('')}
                    </div>
                `;

                item.onclick = (e) => {
                    if (e.target.tagName !== 'BUTTON') {
                        selectSection(index);
                    }
                };

                list.appendChild(item);
            });
        }

        function selectSection(index) {
            currentSection = index;
            renderSections();
            renderSectionEditor();
        }

        function renderSectionEditor() {
            if (currentSection === null) return;

            const editor = document.getElementById('sectionEditor');
            editor.innerHTML = `
                <h3>${plugin.sections[currentSection].title}</h3>
                
                <div class="form-group" style="margin-top: 1.5rem;">
                    <label>Add Content</label>
                    <select id="contentType">
                        <option value="paragraph">Paragraph</option>
                        <option value="button">Button</option>
                        <option value="toggle">Toggle</option>
                        <option value="slider">Slider</option>
                        <option value="colorpicker">Color Picker</option>
                    </select>
                </div>

                <div id="contentForm"></div>
                <button class="btn" onclick="addContent()">Add to Section</button>
            `;

            document.getElementById('contentType').onchange = renderContentForm;
            renderContentForm();
        }

        function renderContentForm() {
            const type = document.getElementById('contentType').value;
            const form = document.getElementById('contentForm');

            let html = '';

            switch(type) {
                case 'paragraph':
                    html = `
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" id="pTitle" placeholder="Paragraph title">
                        </div>
                        <div class="form-group">
                            <label>Text</label>
                            <textarea id="pText" placeholder="Paragraph text"></textarea>
                        </div>
                    `;
                    break;

                case 'button':
                    html = `
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="bName" placeholder="Button name">
                        </div>
                        <div class="form-group">
                            <label>Callback (v = value)</label>
                            <textarea id="bCallback" placeholder="Code to execute"></textarea>
                        </div>
                    `;
                    break;

                case 'toggle':
                    html = `
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="tName" placeholder="Toggle name">
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="tDefault">
                            <label>Default Selected</label>
                        </div>
                        <div class="form-group">
                            <label>Callback (v = state)</label>
                            <textarea id="tCallback" placeholder="Code to execute"></textarea>
                        </div>
                    `;
                    break;

                case 'slider':
                    html = `
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="sName" placeholder="Slider name">
                        </div>
                        <div class="form-row-three">
                            <div class="form-group">
                                <label>Default</label>
                                <input type="number" id="sDefault" value="50">
                            </div>
                            <div class="form-group">
                                <label>Min</label>
                                <input type="number" id="sMin" value="0">
                            </div>
                            <div class="form-group">
                                <label>Max</label>
                                <input type="number" id="sMax" value="100">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Measurement</label>
                                <input type="text" id="sMeasure" placeholder="px, %, etc.">
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="sRounding">
                                <label>Round Values</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Callback (v = value)</label>
                            <textarea id="sCallback" placeholder="Code to execute"></textarea>
                        </div>
                    `;
                    break;

                case 'colorpicker':
                    html = `
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="cName" placeholder="Color picker name">
                        </div>
                        <div class="form-group">
                            <label>Default Color</label>
                            <div class="color-input-wrapper">
                                <input type="color" id="cColor" value="#ffffff">
                                <input type="text" id="cRGB" value="255, 255, 255" placeholder="R, G, B">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Callback (v = {r, g, b})</label>
                            <textarea id="cCallback" placeholder="Code to execute"></textarea>
                        </div>
                    `;
                    break;
            }

            form.innerHTML = html;

            if (type === 'colorpicker') {
                document.getElementById('cColor').onchange = (e) => {
                    const hex = e.target.value;
                    const r = parseInt(hex.substr(1,2), 16);
                    const g = parseInt(hex.substr(3,2), 16);
                    const b = parseInt(hex.substr(5,2), 16);
                    document.getElementById('cRGB').value = `${r}, ${g}, ${b}`;
                };
            }
        }

        function addContent() {
            if (currentSection === null) return;

            const type = document.getElementById('contentType').value;
            let content = { type };

            switch(type) {
                case 'paragraph':
                    content.title = document.getElementById('pTitle').value;
                    content.text = document.getElementById('pText').value;
                    break;

                case 'button':
                    content.name = document.getElementById('bName').value;
                    content.callback = document.getElementById('bCallback').value;
                    break;

                case 'toggle':
                    content.name = document.getElementById('tName').value;
                    content.default = document.getElementById('tDefault').checked;
                    content.callback = document.getElementById('tCallback').value;
                    break;

                case 'slider':
                    content.name = document.getElementById('sName').value;
                    content.default = parseFloat(document.getElementById('sDefault').value);
                    content.min = parseFloat(document.getElementById('sMin').value);
                    content.max = parseFloat(document.getElementById('sMax').value);
                    content.measurement = document.getElementById('sMeasure').value;
                    content.rounding = document.getElementById('sRounding').checked;
                    content.callback = document.getElementById('sCallback').value;
                    break;

                case 'colorpicker':
                    content.name = document.getElementById('cName').value;
                    content.default = document.getElementById('cRGB').value;
                    content.callback = document.getElementById('cCallback').value;
                    break;
            }

            plugin.sections[currentSection].content.push(content);
            renderSections();
            renderSectionEditor();
            updateJSON();
        }

        function deleteSection(index) {
            if (confirm('Delete this section?')) {
                plugin.sections.splice(index, 1);
                if (currentSection === index) {
                    currentSection = null;
                    document.getElementById('sectionEditor').innerHTML = '<p style="opacity: 0.6; text-align: center;">Select or create a section to edit</p>';
                }
                renderSections();
                updateJSON();
            }
        }

        function deleteContent(sIndex, cIndex) {
            if (confirm('Delete this content?')) {
                plugin.sections[sIndex].content.splice(cIndex, 1);
                renderSections();
                updateJSON();
            }
        }

        function copyJSON() {
            const text = document.getElementById('jsonOutput').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('JSON copied to clipboard!');
            });
        }

        document.getElementById('pluginTitle').addEventListener('input', updateJSON);
        document.getElementById('pluginInfo').addEventListener('input', updateJSON);
        document.getElementById('creatorName').addEventListener('input', updateJSON);
    </script>
</body>
</html>
